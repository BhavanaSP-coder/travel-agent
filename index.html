<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Shape a trip idea into a flexible day-by-day plan. Suggestions are examples, not live bookings."><title>Travel Agent</title><link rel="stylesheet" href="style.css"></head><body><header class="top"><div class="wrap"><small>Standalone demo app</small><h1>Travel Agent</h1><p>Shape a trip idea into a flexible day-by-day plan. Suggestions are examples, not live bookings.</p></div></header><main class="main"><section class="panel"><h2>Trip planner</h2><label for="input">What would you like help with?</label><textarea id="input" placeholder="Describe a destination, dates, budget, and interests…"></textarea><button onclick="run()">Plan my trip</button><div id="result" class="result" aria-live="polite"></div></section><footer>Runs locally in your browser. Demo content is generated from your input and is not a substitute for verified or professional advice.</footer></main><script>function out(html){document.querySelector('#result').innerHTML=html}function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function run(){let q=document.querySelector('#input').value.trim();if(!q){out('Tell me where you want to go and what you enjoy.');return}let days=Math.max(2,Math.min(5,(q.match(/\b(\d+)\s*day/i)||[])[1]*1||3));let themes=/food|eat|culinary/i.test(q)?['Explore a neighborhood market','Join a local food walk','Choose a relaxed café and revisit a favorite spot']: /nature|hike|outdoor/i.test(q)?['Visit a nearby park or garden','Plan a scenic walk with breaks','Leave time for a viewpoint or nature reserve']:['Get oriented with a central walk','Visit one major museum or landmark','Explore a neighborhood at an unhurried pace'];let html=`<h3>Your ${days}-day draft</h3><p>${esc(q)}</p>`;for(let d=1;d<=days;d++)html+=`<div class="card"><small>DAY ${d}</small><p><b>Morning:</b> ${themes[(d-1)%3]}.</p><p><b>Afternoon:</b> Pick one nearby attraction and allow travel time.</p><p><b>Evening:</b> Try a well-reviewed local restaurant; keep a flexible backup.</p></div>`;html+='<span class="badge">Planning draft · verify opening times, transport, safety, and prices before travel.</span>';out(html)}</script></body></html>
